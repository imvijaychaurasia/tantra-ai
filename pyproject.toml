[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tantra-ai"
version = "0.1.0"
description = "तंत्र — Local Autonomous Agent Intelligence Stack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Vijay Chaurasia", email = "imvijaychaurasia@gmail.com" }]
keywords = ["ai", "agents", "llm", "automation", "social-media"]

dependencies = [
    # ── API Framework ─────────────────────────────────────────────────────────
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "websockets>=12.0",

    # ── Database / ORM ────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",          # Async PostgreSQL driver
    "psycopg2-binary>=2.9.9",   # Sync driver (Alembic migrations)
    "alembic>=1.13.1",
    "redis[hiredis]>=5.0.3",

    # ── LLM / Agent Orchestration ─────────────────────────────────────────────
    "openai>=1.30.0",            # OpenAI-compatible client (used with LiteLLM)
    "litellm>=1.40.0",
    "langgraph>=0.1.5",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "crewai>=0.55.0",
    "crewai-tools>=0.8.0",
    "pyautogen>=0.2.25",

    # ── Memory ────────────────────────────────────────────────────────────────
    "mem0ai>=0.1.0",
    "qdrant-client>=1.9.0",

    # ── RAG / Knowledge Base ──────────────────────────────────────────────────
    "llama-index>=0.10.40",
    "llama-index-vector-stores-qdrant>=0.2.8",
    "llama-index-llms-litellm>=0.1.3",
    "llama-index-embeddings-litellm>=0.1.3",
    "unstructured[all-docs]>=0.13.0",

    # ── Task Queue / Scheduling ───────────────────────────────────────────────
    "celery[redis]>=5.3.6",
    "flower>=2.0.1",             # Celery monitoring UI
    "apscheduler>=3.10.4",
    "django-celery-beat>=2.6.0", # DB-backed beat scheduler

    # ── Social Media APIs ─────────────────────────────────────────────────────
    # Zernio: unified social API — post to LinkedIn, X, Instagram, TikTok, YouTube
    # and 10+ platforms via a single API key. No per-platform developer apps needed.
    # Connect accounts once at https://zernio.com/dashboard → get ZERNIO_API_KEY
    "zernio-sdk>=0.1.0",
    "google-api-python-client>=2.131.0",   # YouTube Data API v3
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "requests-oauthlib>=1.4.0",            # LinkedIn direct OAuth (fallback)

    # ── Auth (fastapi-users: email/pw + OAuth + JWT refresh) ─────────────────
    "fastapi-users[sqlalchemy]>=13.0.0",
    "httpx-oauth>=0.15.0",              # OAuth clients (Google, GitHub, etc.)
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    "emails>=0.6",                      # Email sending (password reset, verification)

    # ── Config / Env ──────────────────────────────────────────────────────────
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",

    # ── Utilities ─────────────────────────────────────────────────────────────
    "tenacity>=8.2.3",           # Retry logic for API calls
    "structlog>=24.1.0",         # Structured logging
    "rich>=13.7.1",              # Beautiful CLI output
    "typer>=0.12.0",             # CLI commands
    "aiofiles>=23.2.1",
    "Pillow>=10.3.0",            # Image handling
    "feedparser>=6.0.11",        # RSS/Atom feeds
    "beautifulsoup4>=4.12.3",    # Web scraping
    "trafilatura>=1.9.0",        # Article extraction
    "pypdf2>=3.0.0",             # PDF parsing
    "python-docx>=1.1.0",        # DOCX handling
    "arrow>=1.3.0",              # Date/time utilities
    "slugify>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "faker>=24.9.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "ipython>=8.23.0",
    "httpie>=3.2.3",
]

test = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "faker>=24.9.0",
]

[project.scripts]
tantra = "tantra.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tantra"]

# ── Ruff (linter + formatter) ────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["tantra"]

# ── MyPy (type checking) ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src/tantra --cov-report=term-missing"

[tool.coverage.run]
source = ["src/tantra"]
omit = ["*/tests/*", "*/__init__.py"]
