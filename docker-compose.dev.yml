# =============================================================================
# Tantra AI — docker-compose.dev.yml
# Development override: hot reload, debug ports, relaxed security
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   make up-dev
# =============================================================================

# version field removed — obsolete in Docker Compose v2 (auto-detected)

services:

  # API: hot-reload via uvicorn --reload, source mounted live
  tantra-api:
    build:
      target: api
    volumes:
      - ./src:/app/src    # live source (no :ro — allows edits)
      - ./config:/app/config
      - ./tests:/app/tests
    environment:
      DEBUG: "true"
      LOG_FORMAT: "text"
      LOG_LEVEL: "DEBUG"
      ENVIRONMENT: development
      # Show full tracebacks
      PYTHONFAULTHANDLER: "1"
    command: >
      uvicorn tantra.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src
      --log-level debug
    ports:
      - "8000:8000"
      - "5678:5678"   # debugpy port (VS Code attach)

  # Celery worker: auto-restart on code changes
  celery-worker:
    volumes:
      - ./src:/app/src
    environment:
      LOG_LEVEL: DEBUG
      CELERY_LOG_LEVEL: debug
    command: >
      watchfiles
      "celery -A tantra.tasks.celery_app worker --loglevel=debug --concurrency=2 --queues=default,social,agents,scheduled"
      /app/src

  # Celery beat: auto-restart on code changes
  celery-beat:
    volumes:
      - ./src:/app/src
    environment:
      CELERY_LOG_LEVEL: debug

  # Postgres: expose port + pgAdmin-friendly config
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_LOG_STATEMENT: "all"   # log all SQL in dev

  # Redis: expose for direct CLI access
  redis:
    ports:
      - "6379:6379"

  # Qdrant: expose gRPC for local tooling
  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  # LiteLLM: verbose mode
  litellm:
    command: ["--config", "/app/config.yaml", "--port", "4000", "--debug"]

  # Flower: no auth in dev
  flower:
    environment:
      FLOWER_BASIC_AUTH: ""
      FLOWER_DEBUG: "true"
