# =============================================================================
# Tantra AI — docker-compose.yml
# तंत्र  ·  Local Autonomous Agent Intelligence Stack
# =============================================================================
# Platform:  Apple Silicon (arm64) primary, Linux amd64 compatible
# Future:    Linux + NVIDIA GPU → docker-compose.nvidia.yml override
#
# Services (12 total):
#   Core data:     postgres, redis, qdrant
#   Model layer:   ollama, litellm
#   App layer:     tantra-api, celery-worker, celery-beat
#   UI layer:      open-webui, n8n, flower (Celery UI), ttyd (web terminal)
#
# Quick start:
#   make up-core     → infra only (postgres + redis + qdrant + ollama + litellm)
#   make up          → everything
#   make pull-models → download Ollama models after up-core
# =============================================================================

# version field removed — obsolete in Docker Compose v2 (auto-detected)

x-restart: &restart
  restart: unless-stopped

x-hc: &hc
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s

networks:
  tantra-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# All stateful services use bind mounts (./data/<service>/) — no named volumes.
# Bind mounts survive 'docker compose down -v', volume prunes, and daemon restarts.
# Layout: data/postgres/pgdata  data/redis  data/qdrant  data/ollama
#         data/n8n  data/openwebui  data/media  data/uploads

# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # 1. POSTGRES 16 — Primary relational store
  # ---------------------------------------------------------------------------
  postgres:
    <<: *restart
    image: postgres:16-alpine
    container_name: tantra-postgres
    volumes:
      - ./data/postgres/pgdata:/var/lib/postgresql/data   # subdirectory — .gitkeep stays in parent, initdb gets a clean dir
      - ./data/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tantra}
      POSTGRES_USER: ${POSTGRES_USER:-tantra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tantra_secret}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    networks:
      tantra-net:
        ipv4_address: 172.28.0.12
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tantra} -d ${POSTGRES_DB:-tantra}"]

  # ---------------------------------------------------------------------------
  # 2. REDIS 7 — Celery broker + cache + pub/sub
  # ---------------------------------------------------------------------------
  redis:
    <<: *restart
    image: redis:7-alpine
    container_name: tantra-redis
    volumes:
      - ./data/redis:/data                                # bind mount — AOF + RDB files persist here
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-2gb}
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-tantra_redis_secret}
    networks:
      tantra-net:
        ipv4_address: 172.28.0.13
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-tantra_redis_secret}", "ping"]

  # ---------------------------------------------------------------------------
  # 3. QDRANT — Vector database for embeddings + semantic memory
  # ---------------------------------------------------------------------------
  qdrant:
    <<: *restart
    image: qdrant/qdrant:latest
    container_name: tantra-qdrant
    volumes:
      - ./data/qdrant:/qdrant/storage                    # bind mount — vector embeddings persist here
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    networks:
      tantra-net:
        ipv4_address: 172.28.0.14
    healthcheck:
      # qdrant image is pure Rust (no curl/wget) — use bash TCP check
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 4. OLLAMA — Local LLM serving (Metal GPU on Apple Silicon)
  # ---------------------------------------------------------------------------
  ollama:
    <<: *restart
    image: ollama/ollama:latest
    container_name: tantra-ollama
    volumes:
      - ./data/ollama:/root/.ollama                       # bind mount — model weights (10-30 GB) survive any Docker operation
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      # Mac: 1 model at a time to stay within Docker Desktop RAM (~8-12 GB)
      # Linux/NVIDIA: set these to 2+ in .env for parallel inference
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    networks:
      tantra-net:
        ipv4_address: 172.28.0.10
    healthcheck:
      # ollama/ollama image has no curl — use the built-in CLI instead
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # 5. LITELLM — Universal OpenAI-compatible model proxy
  #    Tiers: frontier / director / manager / worker / coder / fast / embedder
  # ---------------------------------------------------------------------------
  litellm:
    <<: *restart
    image: ghcr.io/berriai/litellm:main-latest
    container_name: tantra-litellm
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_CONFIG: /app/config.yaml
      # LiteLLM main-latest requires DATABASE_URL when LITELLM_MASTER_KEY is set.
      # We still keep all model config in litellm_config.yaml (store_model_in_db: false).
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tantra}:${POSTGRES_PASSWORD:-tantra_secret}@postgres:5432/${POSTGRES_DB:-tantra}"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-tantra-master-key}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    networks:
      tantra-net:
        ipv4_address: 172.28.0.11
    healthcheck:
      # litellm image is python-slim (no curl/wget) — use Python urllib instead
      # /health/liveliness returns 200 "I'm alive!" regardless of model state
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s    # extended: LiteLLM takes 30-60s to load model list on slow hardware

  # ---------------------------------------------------------------------------
  # 6. TANTRA API — FastAPI (REST + WebSocket + Auth)
  # ---------------------------------------------------------------------------
  tantra-api:
    <<: *restart
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        BUILDPLATFORM: linux/arm64
    container_name: tantra-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./skills:/app/skills:ro
      - ./config:/app/config      # writable — tantra config model/sync-models writes here
      - ./scripts:/app/scripts:ro  # tantra config sync-models calls generate_litellm_config.py
      - ./data/uploads:/app/uploads
      - ./agents:/app/agents      # hot-reload: agent config files (soul/skills/policy/memory/etc)
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      PYTHONPATH: /app/src
      TANTRA_ROOT: /app            # tantra config commands resolve paths relative to this
      OLLAMA_BASE_URL: http://ollama:11434  # tantra config sync-models uses this to reach Ollama
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tantra}:${POSTGRES_PASSWORD:-tantra_secret}@postgres:5432/${POSTGRES_DB:-tantra}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-tantra}:${POSTGRES_PASSWORD:-tantra_secret}@postgres:5432/${POSTGRES_DB:-tantra}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tantra_redis_secret}@redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-tantra-master-key}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-tantra_redis_secret}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-tantra_redis_secret}@redis:6379/2
      LOG_FORMAT: "text"
      DEBUG: "true"         # enables /docs and /redoc in dev
    networks:
      tantra-net:
        ipv4_address: 172.28.0.20
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]

  # ---------------------------------------------------------------------------
  # 7. CELERY WORKER — Background task executor
  # ---------------------------------------------------------------------------
  celery-worker:
    <<: *restart
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: tantra-celery-worker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./skills:/app/skills:ro
      - ./agents:/app/agents      # hot-reload: agent config files
      - ./data/media:/data/media    # upload_youtube_video reads MP4 files produced by tantra-media
    env_file: .env
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tantra}:${POSTGRES_PASSWORD:-tantra_secret}@postgres:5432/${POSTGRES_DB:-tantra}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-tantra}:${POSTGRES_PASSWORD:-tantra_secret}@postgres:5432/${POSTGRES_DB:-tantra}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-tantra_redis_secret}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-tantra_redis_secret}@redis:6379/2
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-tantra-master-key}
    command: >
      celery -A tantra.tasks.celery_app worker
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --concurrency=${CELERY_CONCURRENCY:-4}
      --queues=default,social,agents,scheduled
    # Graceful shutdown: SIGTERM triggers Celery's warm shutdown, which lets
    # in-flight tasks finish (up to task_time_limit=40 min) before Docker
    # sends SIGKILL.  120s here covers the Celery shutdown handshake itself.
    stop_signal: SIGTERM
    stop_grace_period: 120s
    networks:
      tantra-net:
        ipv4_address: 172.28.0.21

  # ---------------------------------------------------------------------------
  # 8. CELERY BEAT — Cron scheduler
  # ---------------------------------------------------------------------------
  celery-beat:
    <<: *restart
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: tantra-celery-beat
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./skills:/app/skills:ro
      - ./agents:/app/agents      # hot-reload: agent config files
    # CRITICAL: Beat must load .env so it has DB, Zernio, LiteLLM, and all
    # other credentials available when it fires scheduled tasks.
    env_file: .env
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tantra}:${POSTGRES_PASSWORD:-tantra_secret}@postgres:5432/${POSTGRES_DB:-tantra}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-tantra}:${POSTGRES_PASSWORD:-tantra_secret}@postgres:5432/${POSTGRES_DB:-tantra}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-tantra_redis_secret}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-tantra_redis_secret}@redis:6379/2
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-tantra-master-key}
    command: >
      celery -A tantra.tasks.celery_app beat
      --loglevel=${CELERY_LOG_LEVEL:-info}
    # Beat is stateless (just fires tasks into the broker) — 30s is generous
    stop_grace_period: 30s
    networks:
      tantra-net:
        ipv4_address: 172.28.0.22

  # ---------------------------------------------------------------------------
  # 9. OPEN WEBUI — Chat interface (connects to LiteLLM proxy)
  # ---------------------------------------------------------------------------
  open-webui:
    <<: *restart
    image: ghcr.io/open-webui/open-webui:main
    container_name: tantra-open-webui
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      - ./data/openwebui:/app/backend/data               # bind mount — chat history + settings persist
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-tantra-master-key}
      WEBUI_SECRET_KEY: ${SECRET_KEY:-change-me-please-use-a-long-random-string}
      ENABLE_SIGNUP: ${WEBUI_ENABLE_SIGNUP:-true}
      DEFAULT_MODELS: director
      WEBUI_AUTH: "true"
      # Tantra API as backend for custom tools
      TANTRA_API_URL: http://tantra-api:8000
    networks:
      tantra-net:
        ipv4_address: 172.28.0.30
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  # ---------------------------------------------------------------------------
  # 10. N8N — Visual workflow automation
  # ---------------------------------------------------------------------------
  n8n:
    <<: *restart
    image: n8nio/n8n:latest
    container_name: tantra-n8n
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/n8n:/home/node/.n8n                       # bind mount — encryption key + config persist
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-tantra}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-tantra}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-tantra_secret}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-tantra_n8n_admin}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      N8N_ENCRYPTION_KEY: ${SECRET_KEY:-change-me-please-use-a-long-random-string}
      # Connect to Tantra API
      TANTRA_API_URL: http://tantra-api:8000
    networks:
      tantra-net:
        ipv4_address: 172.28.0.31

  # ---------------------------------------------------------------------------
  # 11. FLOWER — Celery task monitoring UI
  #     Access: http://localhost:5555
  # ---------------------------------------------------------------------------
  flower:
    <<: *restart
    image: mher/flower:2.0
    container_name: tantra-flower
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-tantra_redis_secret}@redis:6379/1
      FLOWER_PORT: "5555"
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-tantra_flower}
      FLOWER_PURGE_OFFLINE_WORKERS: "60"
    networks:
      tantra-net:
        ipv4_address: 172.28.0.40

  # ---------------------------------------------------------------------------
  # 12. TTYD — Web-based terminal (browser shell for all users)
  #     Access: http://localhost:7681
  #     Technical users: full shell
  #     Non-technical: `tantra` CLI pre-loaded in PATH
  # ---------------------------------------------------------------------------
  ttyd:
    <<: *restart
    image: tsl0922/ttyd:latest   # Debian-based; alpine has arm64 busybox issues
    container_name: tantra-ttyd
    ports:
      - "${TTYD_PORT:-7681}:7681"
    volumes:
      - ./src:/app/src:ro
    environment:
      PYTHONPATH: /app/src
    command:
      - ttyd
      - --port
      - "7681"
      - --credential
      - "${TTYD_USER:-admin}:${TTYD_PASSWORD:-tantra_shell}"
      - --writable
      - bash
    networks:
      tantra-net:
        ipv4_address: 172.28.0.41

  # ---------------------------------------------------------------------------
  # 13. TANTRA-MEDIA — TTS + Slide image gen + ffmpeg video assembly (Phase 3b)
  #     Access: http://localhost:8100
  #     API docs: http://localhost:8100/docs
  #
  #     Pipeline:
  #       POST /produce  → edge-tts narration + Pillow slides + ffmpeg MP4
  #
  #     Output files:  ./data/media/ (bind-mounted)
  #       audio/{video_id}/scene_N.mp3
  #       images/{video_id}/scene_N.png  + thumbnail.png
  #       clips/{video_id}/scene_N.mp4
  #       output/{video_id}.mp4
  # ---------------------------------------------------------------------------
  tantra-media:
    <<: *restart
    build:
      context: ./tantra-media
      dockerfile: Dockerfile
    container_name: tantra-media
    volumes:
      - ./data/media:/data/media          # output files persisted on host
    ports:
      - "${TANTRA_MEDIA_PORT:-8100}:8100"
    environment:
      TANTRA_MEDIA_DIR: /data/media
      TANTRA_MEDIA_VOICE: ${TANTRA_MEDIA_VOICE:-am_adam}
      TANTRA_MEDIA_SPEECH_RATE: ${TANTRA_MEDIA_SPEECH_RATE:-+5%}
      # ComfyUI connection (Phase 3d — visual_video AI backgrounds)
      COMFYUI_URL: ${COMFYUI_URL:-http://tantra-comfyui:8188}
      COMFYUI_ENABLED: ${COMFYUI_ENABLED:-true}
      COMFYUI_MODEL: ${COMFYUI_MODEL:-flux1-dev.safetensors}
      COMFYUI_CLIP_T5: ${COMFYUI_CLIP_T5:-t5xxl_fp8_e4m3fn.safetensors}
      COMFYUI_CLIP_L: ${COMFYUI_CLIP_L:-clip_l.safetensors}
      COMFYUI_VAE: ${COMFYUI_VAE:-ae.safetensors}
      # 8 steps is sufficient quality for a composited background image.
      # 768x432 reduces denoising VRAM by ~60% vs 1280x720; still sharp after
      # Pillow upscale to 1920x1080 for the final slide.
      COMFYUI_STEPS: ${COMFYUI_STEPS:-8}
      COMFYUI_WIDTH: ${COMFYUI_WIDTH:-768}
      COMFYUI_HEIGHT: ${COMFYUI_HEIGHT:-432}
      COMFYUI_TIMEOUT: ${COMFYUI_TIMEOUT:-300}
    networks:
      tantra-net:
        ipv4_address: 172.28.0.50
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 14. COMFYUI — Flux.1-dev image generation for visual_video scenes (Phase 3d)
  #     Access: http://localhost:8188
  #     ComfyUI GUI: http://localhost:8188 (browser)
  #
  #     Required models (download to ./data/comfyui/models/):
  #       diffusion_models/flux1-dev.safetensors  — Flux UNET fp16 (24 GB)
  #           OR fp8 variant (~12 GB) named identically
  #       vae/ae.safetensors                       — Flux VAE
  #       clip/t5xxl_fp8_e4m3fn.safetensors        — T5 text encoder fp8
  #       clip/clip_l.safetensors                  — CLIP-L text encoder
  #
  #     VRAM note: fp8 UNET + VAE + T5 fp8 ≈ 14–15 GB (fits RTX 5070 Ti 16 GB)
  #     GPU passthrough: enabled via docker-compose.nvidia.yml override
  #
  #     Called by tantra-media service for visual_video type videos.
  #     Set COMFYUI_ENABLED=false in .env to use Pillow fallback globally.
  # ---------------------------------------------------------------------------
  comfyui:
    <<: *restart
    build:
      context: ./tantra-comfyui
      dockerfile: Dockerfile
    container_name: tantra-comfyui
    volumes:
      - ./data/comfyui/models:/root/ComfyUI/models          # model weights
      - ./data/comfyui/output:/root/ComfyUI/output          # generated images
      - ./data/comfyui/custom_nodes:/root/ComfyUI/custom_nodes  # extensions
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    environment:
      # --lowvram: offload models to CPU RAM between operations so the full
      # Flux pipeline (UNET ~13 GB + T5 4.6 GB + VAE + CLIP) fits in 16 GB VRAM.
      # Without this flag ComfyUI keeps everything live → OOM on RTX 5070 Ti 16 GB.
      CLI_ARGS: "--listen 0.0.0.0 --port 8188 --lowvram"
    networks:
      tantra-net:
        ipv4_address: 172.28.0.51
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8188/system_stats')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s    # ComfyUI takes ~60-90s to start with large models

# =============================================================================
# NVIDIA GPU override (Linux only):
# docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
# =============================================================================
