# =============================================================================
# Tantra AI — docker-compose.nvidia.yml
# NVIDIA GPU override for Linux machines
#
# Requirements:
#   - NVIDIA GPU with CUDA 12+
#   - nvidia-container-toolkit installed
#   - nvidia-docker2 configured
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#   make up-nvidia
# =============================================================================

# version field removed — obsolete in Docker Compose v2 (auto-detected)

services:

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Override: use CUDA instead of CPU
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_NUM_GPU: "99"          # use all GPU layers
      OLLAMA_GPU_OVERHEAD: "0"

  # ComfyUI — GPU passthrough for Flux.1-dev image generation
  comfyui:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
