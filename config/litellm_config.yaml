# =============================================================================
# Tantra AI — LiteLLM Proxy Configuration
# तंत्र  ·  Universal model gateway
# =============================================================================
# Model tier aliases (all local models available in Ollama):
#   frontier  →  Cloud preferred (Claude/GPT-4o), qwen3:30b local fallback
#   director  →  Senior reasoning    — Qwen3-30B MoE  (8GB VRAM, 128K ctx)
#   manager   →  Mid-tier planning   — Qwen3-14B      (10GB VRAM, 128K ctx)
#   worker    →  Focused execution   — Qwen3-14B      (10GB VRAM, 128K ctx)
#   coder     →  Code specialist     — Qwen3-30B      (best coder available)
#   fast      →  Ultra-fast loops    — Qwen3-4B       (3GB VRAM, 128K ctx)
#   embedder  →  Embeddings          — BGE-M3 + nomic-embed-text
#
# Pending pulls (will add back when VRAM budget allows):
#   deepseek-coder-v2:16b, phi4:14b, mistral-nemo:12b, qwen2.5:72b, llama3.3:70b
#
# Last config update: 2026-04-05 — stripped unpulled models to fix routing errors
# =============================================================================

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  store_model_in_db: false          # keep all model config in this YAML, not Postgres
  disable_spend_logs: true
  disable_master_key_return: true

litellm_settings:
  set_verbose: false
  json_logs: true
  request_timeout: 600                    # 10 min for long agent chains
  num_retries: 2
  fallbacks:
    - frontier: ["director", "manager"]   # If cloud fails → local fallback
    - director: ["manager", "fast"]       # If qwen3:30b OOM → qwen3:14b → qwen3:4b
    - manager:  ["worker", "fast"]        # If 14B busy → worker → fast
  drop_params: true                       # Ignore unsupported params silently

router_settings:
  routing_strategy: "least-busy"          # Changed from latency-based to avoid probing unpulled models
  model_group_alias:
    gpt4: "frontier"
    claude: "frontier"
    llama70b: "director"
    qwen30b: "director"
    qwen72b: "manager"
    qwen14b: "worker"
    phi4: "worker"
    qwen4b: "fast"
    mistral: "fast"

model_list:

  # ---------------------------------------------------------------------------
  # FRONTIER — Strategic reasoning, final decisions, complex planning
  # Cloud: Claude 3.5 Sonnet or GPT-4o  |  Local fallback: qwen3:30b
  # ---------------------------------------------------------------------------
  - model_name: frontier
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: "os.environ/ANTHROPIC_API_KEY"
      max_tokens: 8192
      temperature: 0.7
    model_info:
      description: "CAIO and C-suite agents — strategic decisions"

  - model_name: frontier
    litellm_params:
      model: openai/gpt-4o
      api_key: "os.environ/OPENAI_API_KEY"
      max_tokens: 8192
      temperature: 0.7
    model_info:
      description: "Frontier fallback via OpenAI"

  - model_name: frontier
    litellm_params:
      model: ollama_chat/qwen3:30b
      api_base: "http://ollama:11434"
      stream: true
      max_tokens: 8192
      temperature: 0.7
      extra_body:
        think: false          # disable thinking for consistent response times
    model_info:
      description: "Local frontier fallback — Qwen3-30B MoE (8GB VRAM)"

  # ---------------------------------------------------------------------------
  # DIRECTOR — Department heads, weekly planning, subordinate coordination
  # Cloud: Groq llama3.3:70b  |  Local: qwen3:30b MoE
  # ---------------------------------------------------------------------------
  - model_name: director
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: "os.environ/GROQ_API_KEY"
      max_tokens: 8192
      temperature: 0.6
    model_info:
      description: "Director cloud — llama3.3:70b via Groq (fast, low latency)"

  - model_name: director
    litellm_params:
      model: ollama_chat/qwen3:30b
      api_base: "http://ollama:11434"
      stream: true
      max_tokens: 8192
      temperature: 0.6
      extra_body:
        think: false          # disable qwen3 chain-of-thought — without this qwen3:30b
                              # takes 2-3 min per generation due to internal reasoning tokens
    model_info:
      description: "Director local — Qwen3-30B MoE (8GB VRAM, 128K ctx)"

  # ---------------------------------------------------------------------------
  # MANAGER — Mid-level agents, multi-step execution, sub-task management
  # Primary: Qwen3-14B (10GB VRAM, 128K ctx)
  # ---------------------------------------------------------------------------
  - model_name: manager
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: "http://ollama:11434"
      stream: true
      max_tokens: 8192
      temperature: 0.5
      extra_body:
        think: false          # disable qwen3 chain-of-thought for responsive manager agents
    model_info:
      description: "Manager — Qwen3-14B (10GB VRAM, 128K ctx)"

  # ---------------------------------------------------------------------------
  # WORKER — Focused single-task execution
  # Primary: Qwen3-14B (128K ctx)
  # thinking disabled: worker tasks are short-output (LinkedIn posts, summaries)
  # and qwen3 thinking mode exhausts the token budget before producing output.
  # ---------------------------------------------------------------------------
  - model_name: worker
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: "http://ollama:11434"
      stream: true
      max_tokens: 4096
      temperature: 0.4
      extra_body:
        think: false          # disable qwen3 chain-of-thought for fast text gen
    model_info:
      description: "Worker — Qwen3-14B (128K ctx, post writers, analyzers, thinking OFF)"

  # ---------------------------------------------------------------------------
  # CODER — Code generation, debugging, infra scripting
  # Best available: qwen3:30b (MoE, excellent reasoning)
  # Fallback: qwen3:14b
  # (deepseek-coder-v2:16b pending pull)
  # ---------------------------------------------------------------------------
  - model_name: coder
    litellm_params:
      model: ollama_chat/qwen3:30b
      api_base: "http://ollama:11434"
      stream: true
      max_tokens: 4096
      temperature: 0.2
      extra_body:
        think: false          # disable thinking for coder — structured output tasks don't
                              # benefit from chain-of-thought and it causes timeout issues
    model_info:
      description: "Coder primary — Qwen3-30B (best available, pending deepseek pull)"

  - model_name: coder
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: "http://ollama:11434"
      stream: true
      max_tokens: 4096
      temperature: 0.2
    model_info:
      description: "Coder fallback — Qwen3-14B"

  # ---------------------------------------------------------------------------
  # FAST — Ultra-low latency for reactive/classification/agentic loop tasks
  # Primary: Qwen3-4B (128K ctx, 3GB VRAM)
  # Cloud fallback: Groq Mixtral
  # ---------------------------------------------------------------------------
  - model_name: fast
    litellm_params:
      model: ollama_chat/qwen3:4b
      api_base: "http://ollama:11434"
      stream: true
      max_tokens: 2048
      temperature: 0.3
    model_info:
      description: "Fast primary — Qwen3-4B (128K ctx, 3GB VRAM, agentic loops)"

  - model_name: fast
    litellm_params:
      model: groq/mixtral-8x7b-32768
      api_key: "os.environ/GROQ_API_KEY"
      max_tokens: 2048
      temperature: 0.3
    model_info:
      description: "Fast cloud fallback — Mixtral 8x7B via Groq"

  # ---------------------------------------------------------------------------
  # EMBEDDER — Text embeddings for semantic memory and RAG
  # Primary: BGE-M3 (dense+sparse+ColBERT, 100 langs, 8192 ctx)
  # Fallback: nomic-embed-text + OpenAI cloud
  # ---------------------------------------------------------------------------
  - model_name: embedder
    litellm_params:
      model: ollama/bge-m3
      api_base: "http://ollama:11434"
    model_info:
      description: "Embedder primary — BGE-M3 (dense+sparse+ColBERT, 100 langs)"

  - model_name: embedder
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: "http://ollama:11434"
    model_info:
      description: "Embedder fallback — nomic-embed-text (768-dim)"

  - model_name: embedder
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: "os.environ/OPENAI_API_KEY"
    model_info:
      description: "Embedder cloud fallback — OpenAI text-embedding-3-small"
